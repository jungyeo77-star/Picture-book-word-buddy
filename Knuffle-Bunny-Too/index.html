<style>

<h1>Picture Book Word Buddy</h1>
<div class="book-info"><h2>Knuffle Bunny Too</h2><p class="small-text">by Mo Willems</p><p>Knuffle Bunny Too 단어를 복습해 볼까요?</p></div>
<div class="choice-box"><h3>1. Choose a word set</h3><div class="button-row" id="setButtonArea"></div></div>
<div class="choice-box"><h3>2. Choose a game mode</h3><div class="button-row"><button id="wordToMeaningButton" class="soft-button" onclick="chooseMode('wordToMeaning')">Word → Meaning</button><button id="meaningToWordButton" class="soft-button" onclick="chooseMode('meaningToWord')">Meaning → Word</button></div><p class="small-text">Word → Meaning: 영어 단어를 보고 한국어 뜻을 써요.<br>Meaning → Word: 한국어 뜻을 보고 영어 단어를 써요.</p></div>
<div class="button-row"><button onclick="startGame()">Start</button></div><p id="homeMessage" class="feedback"></p>
</section>
<section id="practiceScreen" class="hidden">
<h2 id="setTitle"></h2><p class="small-text" id="modeTitle"></p><div class="progress" id="progressText"></div>
<div class="top-nav"><button id="prevArrow" class="arrow-button" onclick="previousWord()" aria-label="Previous word">‹</button><span class="top-nav-space" aria-hidden="true"></span><button id="nextArrow" class="arrow-button" onclick="goNextFromArrow()" aria-label="Next word">›</button></div>
<div class="card"><div id="promptLabel" class="prompt-label"></div><div id="questionText"></div><input id="answerInput" type="text" autocomplete="off" /><div id="feedback" class="feedback"></div><div id="answerArea" class="hidden"></div></div>
<div class="button-row" id="buttonArea"></div>
</section>
<section id="finishScreen" class="hidden">
<h1>정말 잘했어요!</h1><p>오늘의 그림책 단어를 끝까지 연습했어요.</p>
<div class="word-list"><h3>오늘 연습한 단어</h3><ol id="practicedList"></ol></div>
<div class="button-row"><button onclick="reviewAgain()">다시 연습하기</button><button class="secondary-button" onclick="backToHome()">처음으로 돌아가기</button></div>
</section>
</main>

let selectedSetKey="", selectedMode="", currentWords=[], currentIndex=0;
const homeScreen=document.getElementById("homeScreen"), practiceScreen=document.getElementById("practiceScreen"), finishScreen=document.getElementById("finishScreen");

function chooseSet(setKey){selectedSetKey=setKey;homeMessage.textContent="";bookData.sets.forEach(function(set){const b=document.getElementById(set.key+"Button"); if(b) b.style.outline="none";});const selectedButton=document.getElementById(setKey+"Button"); if(selectedButton) selectedButton.style.outline="5px solid #6fa69d";}
function chooseMode(mode){selectedMode=mode;homeMessage.textContent="";document.getElementById("wordToMeaningButton").style.outline="none";document.getElementById("meaningToWordButton").style.outline="none";document.getElementById(mode==="wordToMeaning"?"wordToMeaningButton":"meaningToWordButton").style.outline="5px solid #9a90cf";}
function startGame(){if(!selectedSetKey||!selectedMode){homeMessage.textContent="단어 세트와 게임 방식을 하나씩 골라 주세요.";return;}const selectedSet=bookData.sets.find(set=>set.key===selectedSetKey);currentWords=selectedSet.words;currentIndex=0;homeScreen.classList.add("hidden");finishScreen.classList.add("hidden");practiceScreen.classList.remove("hidden");setTitle.textContent=selectedSet.title;modeTitle.textContent=selectedMode==="wordToMeaning"?"Word → Meaning: 영어 단어를 보고 한국어 뜻을 써요.":"Meaning → Word: 한국어 뜻을 보고 영어 단어를 써요.";showQuestion();}
function showQuestion(){const item=currentWords[currentIndex];progressText.textContent="Word "+(currentIndex+1)+" of "+currentWords.length;updateArrowButtons();feedback.textContent="";answerInput.value="";answerArea.classList.add("hidden");answerArea.innerHTML="";buttonArea.innerHTML="";answerInput.classList.remove("hidden");if(selectedMode==="wordToMeaning"){promptLabel.textContent="이 단어의 뜻은 무엇일까요?";questionText.className="question";questionText.textContent=item.word;answerInput.placeholder="한국어 뜻을 써 보세요.";addButton("단어 듣기",()=>speakEnglish(item.word),"quiet-button");}else{promptLabel.textContent="이 뜻에 맞는 영어 단어는 무엇일까요?";questionText.className="meaning-question";questionText.textContent=item.meaning;answerInput.placeholder="영어 단어를 써 보세요.";}addButton("Check",checkAnswer);answerInput.focus();}
function checkAnswer(){const item=currentWords[currentIndex], userAnswer=answerInput.value;if(selectedMode==="wordToMeaning"){isMeaningMatch(userAnswer,item.meaning)?setHeartFeedback("잘했어요! 뜻을 잘 기억했어요."):setSmileFeedback("좋은 시도예요! 같이 확인해 봐요.");}else{isWordMatch(userAnswer,item)?setHeartFeedback("잘했어요! 단어를 잘 기억해서 썼어요."):setSmileFeedback("좋은 시도예요! 같이 확인해 봐요.");}showAnswer(item);}
function showAnswer(item){answerArea.classList.remove("hidden");answerArea.innerHTML='<div class="answer-box"><div class="answer-word">'+escapeHTML(item.word)+'</div><div class="answer-meaning">'+escapeHTML(item.meaning)+'</div><div class="sentence">'+escapeHTML(item.sentence)+'</div></div>';buttonArea.innerHTML="";addButton("단어 듣기",()=>speakEnglish(item.word),"quiet-button");addButton("문장 듣기",()=>speakEnglish(item.sentence),"quiet-button");}
function speakEnglish(text){if(!("speechSynthesis" in window)){feedback.textContent="이 브라우저에서는 듣기 기능을 사용할 수 없어요.";return;}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="en-US";utterance.rate=.8;utterance.pitch=1;window.speechSynthesis.speak(utterance);}
function nextWord(){if(currentIndex<currentWords.length-1){currentIndex++;showQuestion();}else{showFinishScreen();}}

function reviewAgain(){currentIndex=0;finishScreen.classList.add("hidden");practiceScreen.classList.remove("hidden");showQuestion();}
function backToHome(){finishScreen.classList.add("hidden");practiceScreen.classList.add("hidden");homeScreen.classList.remove("hidden");}
function addButton(text,action,className){const b=document.createElement("button");b.textContent=text;b.onclick=action;if(className)b.classList.add(className);buttonArea.appendChild(b);}
function setHeartFeedback(message){feedback.innerHTML='<span class="heart-seq">💗</span><span class="heart-seq">💖</span><span class="heart-seq">💕</span>'+escapeHTML(message);}
function setSmileFeedback(message){feedback.innerHTML='<span class="smile-icon" aria-hidden="true">😊</span>'+escapeHTML(message);}
function isWordMatch(userAnswer,item){const u=normalizeAnswer(userAnswer); if(!u)return false; const answers=item.accepted||[item.word]; return answers.some(a=>normalizeAnswer(a)===u);}
function isMeaningMatch(userAnswer,meaning){const u=normalizeKorean(userAnswer), m=normalizeKorean(meaning);if(!u)return false;if(m===u)return true;if(m.includes(u)&&u.length>=2)return true;const chunks=meaning.split(/[，,\/()（）~、]/).map(p=>normalizeKorean(p)).filter(p=>p.length>=2);return chunks.some(c=>u.includes(c)||c.includes(u));}
function normalizeAnswer(text){return String(text).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[.?!,]/g,"").replace(/\s+/g," ");}
function normalizeKorean(text){return String(text).trim().toLowerCase().replace(/[.?!,，、]/g,"").replace(/[()（）]/g," ").replace(/\s+/g," ");}
function escapeHTML(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
answerInput.addEventListener("keydown",function(event){if(event.key==="Enter")checkAnswer();});
</script>
